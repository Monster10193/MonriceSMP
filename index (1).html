<html lang="en" dir="ltr">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Vazirmatn:wght@300;400;700&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--line:rgba(255,255,255,.14);--dim:rgba(255,255,255,.55);--soft:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0}html{color-scheme:dark}
body{background:#000 radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.08),transparent 55%) no-repeat;color:#fff;font:400 16px/1.5 Inter,Vazirmatn,system-ui,sans-serif;min-height:100vh}
[dir=rtl] body{font-family:Vazirmatn,Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}main{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;margin-bottom:20px}h2{font-size:18px;font-weight:600;margin:26px 0 12px}
.dim{color:var(--dim)}.center{text-align:center}.hint{font-size:12px;color:var(--dim)}
.nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:300;letter-spacing:.25em;font-size:14px}.brand b{font-weight:800}
.nav nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}.nav nav a{padding:6px 12px;border-radius:999px;font-size:14px;color:var(--dim);transition:.25s}
.nav nav a:hover,.nav nav a.active{color:#000;background:#fff}.nav-right{display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{background:none;border:0;color:var(--dim);padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:#fff;color:#000}
.btn{display:inline-block;background:#fff;color:#000;border:1px solid #fff;padding:11px 22px;border-radius:12px;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 0 rgba(255,255,255,.25),0 14px 30px rgba(255,255,255,.08)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(255,255,255,.25)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:#fff;box-shadow:none;border-color:var(--line)}.btn.ghost:hover{border-color:#fff}.btn.sm{padding:6px 14px;font-size:13px;border-radius:999px;box-shadow:none}
.card{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 50px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.1)}
.tilt{transition:transform .2s ease-out,border-color .3s;will-change:transform}.tilt:hover{border-color:rgba(255,255,255,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.price{font-size:22px;font-weight:800;margin:10px 0 14px}.price small{font-weight:400;color:var(--dim);font-size:13px}
input,textarea,select{width:100%;background:#000;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;margin-bottom:12px;transition:.2s}
input:focus,textarea:focus{outline:0;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}input[type=checkbox]{width:auto;margin:0 6px}input[type=color]{padding:2px;height:40px;width:56px;margin:0}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.err{border:1px solid #fff;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
.warn{background:#fff;color:#000;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:16px}
.hero{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.ip{font-size:clamp(26px,6vw,56px);font-weight:800;letter-spacing:-.02em;cursor:pointer;background:none;border:0;color:#fff;font-family:inherit;text-shadow:0 10px 30px rgba(255,255,255,.2);transition:transform .25s}.ip:hover{transform:scale(1.03)}
.status{display:flex;flex-direction:column;align-items:center;gap:14px}
.orb{--mx:35%;--my:30%;width:110px;height:110px;border-radius:50%;border:1px solid var(--line);cursor:pointer;transition:all .5s;background:radial-gradient(circle at var(--mx) var(--my),#fff,#888 45%,#111 100%)}
.orb.online{box-shadow:0 0 40px 8px rgba(255,255,255,.55),0 0 120px 30px rgba(255,255,255,.2),inset -10px -14px 24px rgba(0,0,0,.45);animation:glow 2.6s ease-in-out infinite}
.orb.offline{filter:grayscale(1) brightness(.22);box-shadow:inset -10px -14px 24px rgba(0,0,0,.6)}.orb.loading{filter:brightness(.5);animation:pulse 1s infinite}
@keyframes glow{50%{box-shadow:0 0 60px 14px rgba(255,255,255,.7),0 0 150px 40px rgba(255,255,255,.28),inset -10px -14px 24px rgba(0,0,0,.45)}}@keyframes pulse{50%{opacity:.4}}
.sl{letter-spacing:.3em;font-weight:600;font-size:14px}.sl.offline{color:var(--dim)}
.chat{display:flex;flex-direction:column;height:62vh}.msgs{flex:1;overflow-y:auto;padding:0 6px 8px}
.msg{padding:7px 0;border-bottom:1px solid var(--soft);font-size:15px;word-break:break-word}.msg.system{color:var(--dim);font-style:italic}
.who{background:none;border:0;color:inherit;font:inherit;font-weight:700;padding:0;cursor:default}.who.click{cursor:pointer;text-decoration:underline dotted}
.tag{display:inline-block;font-size:11px;border:1px solid #fff;border-radius:6px;padding:0 6px;margin:0 6px}.tag.owner{background:#fff;color:#000}
.rankbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px}.rankbar input{width:130px;margin:0;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center}.row input{margin:0}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--dim);font-weight:400}td input{margin:0;padding:6px 8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}.pill.approved,.pill.open{background:#fff;color:#000}.pill.rejected,.pill.closed{opacity:.45}
.ov{overflow-x:auto}.switch{display:flex;border:1px solid #fff;border-radius:12px;overflow:hidden;width:fit-content;margin-bottom:8px}.switch button{background:none;border:0;color:#fff;padding:10px 20px;cursor:pointer;font:inherit;font-weight:600}.switch button.on{background:#fff;color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;z-index:20}.modal .card{width:min(520px,100%);max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:92vw;font-size:14px}
.skin{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}@media(max-width:820px){.skin,.two{grid-template-columns:1fr!important}}
.cvw{position:relative;width:100%;max-width:512px;aspect-ratio:1;margin:0 auto;border:1px solid var(--line);background:repeating-conic-gradient(#1a1a1a 0 25%,#0a0a0a 0 50%) 0 0/16px 16px}
#sk{width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair;display:block}
.gridov{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:1.5625% 1.5625%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools .on{background:#fff;color:#000}
.pv{display:flex;gap:24px;justify-content:center;perspective:700px}.pv canvas{width:112px;height:224px;image-rendering:pixelated;transition:transform .15s;filter:drop-shadow(0 12px 14px rgba(255,255,255,.12))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}.chips button:hover{color:#fff;border-color:#fff}
.two{display:grid;grid-template-columns:260px 1fr;gap:18px}.tk{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}.tk.on{border-color:#fff}
@media(max-width:640px){.nav nav{order:3;flex-basis:100%}}
</style>
</head>

<script>
/* ================= CONFIG ================= */
const CONFIG={OWNER_EMAIL:'mahanbagheri757@gmail.com',IP:'Monricesmp1.aternos.me',TELEGRAM:'monster10193',
 STATUS_URL:'https://api.mcstatus.io/v2/status/java/',
 AI_ENDPOINT:'' /* optional: POST {prompt} -> {image:"data:image/png;base64,..."} (your own AI backend) */};

/* ================= i18n (add languages here) ================= */
const D={en:{'nav.home':'Home','nav.store':'Store','nav.skin':'AI Skin Creator','nav.chat':'Chat','nav.support':'Support','nav.admin':'Admin','nav.login':'Log in','nav.logout':'Log out',
online:'ONLINE',offline:'OFFLINE',checking:'CHECKING',players:'players',copy:'Click to copy',copied:'Copied','hero.sub':'Premium survival. Zero noise.',

'e.user':'Username: 3-16 letters, numbers or _','e.mail':'A Gmail address is required','e.pass':'Password must be at least 8 characters','e.dup':'Username or email already in use','e.cred':'Invalid username or password','e.code':'Wrong code',
'sk.title':'AI Skin Creator','sk.prompt':'Describe your skin','sk.gen':'Generate','sk.wild':'Unfiltered creative mode (wild variations)','sk.export':'Export .png','sk.import':'Import .png','sk.clear':'Clear','sk.front':'Front','sk.back':'Back','sk.pen':'Pen','sk.eraser':'Eraser','sk.fill':'Fill','sk.pick':'Pick','sk.ph':'e.g. black ninja with red scarf and blue eyes'},
fa:{'nav.home':'خانه','nav.store':'فروشگاه','nav.skin':'ساخت اسکین با AI','nav.chat':'چت','nav.support':'پشتیبانی','nav.admin':'مدیریت','nav.login':'ورود','nav.logout':'خروج',
online:'آنلاین',offline:'آفلاین',checking:'در حال بررسی',players:'بازیکن',copy:'برای کپی کلیک کنید',copied:'کپی شد','hero.sub':'بقای حرفه‌ای. بدون شلوغی.',
'store.title':'فروشگاه',buy:'خرید',irt:'تومان','store.empty':'هنوز محصولی نیست.','warn':'هشدار: برای دریافت آیتم‌ها حتماً با نام کاربری دقیق ماینکرافت خود وارد شوید.',
'c1':'۱ · پرداخت','c2':'۲ · آپلود رسید تراکنش','c.login':'برای ادامه وارد شوید','c.as':'ورود با','c.submit':'ثبت سفارش','c.cancel':'انصراف','c.done':'سفارش ثبت شد. مدیر به‌زودی رسید را بررسی می‌کند.',
'orders':'سفارش‌های من',pending:'در انتظار',approved:'تأیید شده',rejected:'رد شده','chat.title':'چت عمومی','chat.ph':'پیام بنویسید…',send:'ارسال','chat.login':'برای چت وارد شوید','chat.admin':'مدیر: روی نام کلیک کنید تا رتبه بدهید · /rank <user> <rank> · /promote · /demote',
'sup.title':'مرکز پشتیبانی','sup.tg':'تلگرام (فوری)','sup.new':'تیکت جدید','sup.subj':'موضوع','sup.msg':'مشکل خود را شرح دهید','sup.open':'ثبت تیکت','closed':'این تیکت بسته شده است.','sup.close':'بستن تیکت','sup.mine':'تیکت‌های من','sup.live':'چت زنده پشتیبانی','sup.pick':'یک تیکت انتخاب یا ایجاد کنید.',
'a.user':'نام کاربری ماینکرافت','a.pass':'رمز عبور','a.mail':'جیمیل','a.login':'ورود','a.reg':'ساخت حساب','a.code':'کد تأیید','a.verify':'تأیید','a.sent':'کد ۶ رقمی ارسال شد به','a.demo':'حالت دمو: سرور ایمیل وصل نیست و کد روی صفحه نمایش داده می‌شود.','a.no':'حساب ندارید؟ ثبت‌نام','a.has':'حساب دارید؟ ورود',
'e.user':'نام کاربری: ۳ تا ۱۶ حرف انگلیسی، عدد یا _','e.mail':'آدرس جیمیل لازم است','e.pass':'رمز عبور حداقل ۸ کاراکتر','e.dup':'نام کاربری یا ایمیل قبلاً ثبت شده','e.cred':'نام کاربری یا رمز اشتباه است','e.code':'کد اشتباه است',
'sk.title':'ساخت اسکین با AI','sk.prompt':'اسکین خود را توصیف کنید','sk.gen':'بساز','sk.wild':'حالت خلاقانه‌ی بدون محدودیت (تنوع زیاد)','sk.export':'خروجی .png','sk.import':'ورود .png','sk.clear':'پاک کردن','sk.front':'جلو','sk.back':'پشت','sk.pen':'قلم','sk.eraser':'پاک‌کن','sk.fill':'پر کردن','sk.pick':'انتخاب رنگ','sk.ph':'مثلاً نینجای مشکی با شال قرمز و چشم آبی'}};
let lang=localStorage.getItem('lang')||'en';const t=k=>(D[lang]&&D[lang][k])||D.en[k]||k;

/* ================= Backend layer =================
   DEMO MODE: everything below stores data in this browser's localStorage, so nothing is shared
   between visitors and nothing is truly secure. For production replace the functions in `API`
   with fetch() calls to your server (Neon DB, Resend email codes, Blob uploads). */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bc=new BroadcastChannel('msmp');
const load=()=>{try{return JSON.parse(localStorage.getItem('msmp'))}catch{return null}};
let S=load()||{users:[],session:null,seq:10,settings:{ip:CONFIG.IP,mode:'auto',pay:'Card number: 0000-0000-0000-0000 — Name: YOUR NAME',ann:''},
 products:[{id:1,name:'VIP',desc:'VIP rank with exclusive perks',cat:'Ranks',price:150000,on:true},{id:2,name:'MVP',desc:'MVP rank with premium perks',cat:'Ranks',price:300000,on:true},{id:3,name:'Starter Kit',desc:'Tools, food and armor',cat:'Items',price:50000,on:true}],
 orders:[],tickets:[],msgs:[{id:1,u:'SYSTEM',role:'system',b:'Welcome to MonriceSMP1',t:Date.now()}]};
const save=()=>{localStorage.setItem('msmp',JSON.stringify(S));bc.postMessage(1)};
bc.onmessage=()=>{S=load()||S;onSync()};
const sha=async s=>crypto.subtle?[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join(''):btoa(unescape(encodeURIComponent(s)));
const cur=()=>{const u=S.users.find(x=>x.id===S.session&&x.ok);if(u&&u.e===CONFIG.OWNER_EMAIL)u.role='owner';return u||null};
const isAdm=u=>!!u&&(u.role==='admin'||u.role==='owner'),isOwn=u=>u.role==='owner'||u.e===CONFIG.OWNER_EMAIL;
const irt=n=>Number(n).toLocaleString('en-US'),sys=b=>S.msgs.push({id:++S.seq,u:'SYSTEM',role:'system',b,t:Date.now()});
const API={
 sendCode(e,c){toast('DEMO — code for '+e+': '+c,15000)},            // real: POST /api/send-code -> Resend
 async register(u,p,e){e=e.toLowerCase();
  if(!/^[A-Za-z0-9_]{3,16}$/.test(u))throw Error(t('e.user'));if(!/^[^\s@]+@gmail\.com$/.test(e))throw Error(t('e.mail'));if(p.length<8)throw Error(t('e.pass'));
  if(S.users.some(x=>x.u.toLowerCase()==u.toLowerCase()||x.e==e))throw Error(t('e.dup'));
  const code=String(100000+Math.floor(Math.random()*900000));
  S.users.push({id:++S.seq,u,e,h:await sha(p),role:e===CONFIG.OWNER_EMAIL?'owner':'player',rank:'Member',ok:false,code});save();API.sendCode(e,code);return e},
 async login(u,p){const x=S.users.find(y=>y.u.toLowerCase()==u.toLowerCase());if(!x||x.h!==await sha(p))throw Error(t('e.cred'));
  if(!x.ok){x.code=String(100000+Math.floor(Math.random()*900000));save();API.sendCode(x.e,x.code);return{verify:x.e}}S.session=x.id;save();return{}},
 verify(e,c){const x=S.users.find(y=>y.e==e);if(!x||x.code!==String(c).trim())throw Error(t('e.code'));x.ok=true;x.code=null;S.session=x.id;save()},
 async ping(){if(S.settings.mode!=='auto')return{online:S.settings.mode==='online'};
  try{const d=await(await fetch(CONFIG.STATUS_URL+encodeURIComponent(S.settings.ip),{cache:'no-store'})).json();return{online:!!d.online,p:d.players?.online,m:d.players?.max}}catch{return{online:false}}},
 setRank(me,name,rank){if(!isAdm(me))throw Error('Admins only');rank=(rank||'').trim().slice(0,16);
  if(!name||!/^[\w +\-]+$/.test(rank))throw Error('Usage: /rank <user> <rank>');
  const x=S.users.find(u=>u.ok&&u.u.toLowerCase()==name.toLowerCase());if(!x)throw Error('User not found');
  if(isOwn(x)&&me.role!=='owner')throw Error('Cannot modify the owner');x.rank=rank;sys(`${me.u} set ${x.u}'s rank to ${rank}`);save()},
 setRole(me,name,role){if(me.role!=='owner')throw Error('Owner only');const x=S.users.find(u=>u.ok&&u.u.toLowerCase()==(name||'').toLowerCase());
  if(!x)throw Error('User not found');if(isOwn(x))throw Error('Cannot modify the owner');x.role=role;sys(`${me.u} ${role==='admin'?'promoted':'demoted'} ${x.u}`);save()},
 chat(me,b){b=b.trim().slice(0,300);if(!b)return;
  if(b[0]==='/'){if(!isAdm(me))throw Error('Commands are admin-only');const[c,tg,...r]=b.split(/\s+/);
   if(c==='/rank')return API.setRank(me,tg,r.join(' '));if(c==='/promote'||c==='/demote')return API.setRole(me,tg,c==='/promote'?'admin':'player');
   throw Error('Commands: /rank <user> <rank> · /promote <user> · /demote <user>')}
  S.msgs.push({id:++S.seq,u:me.u,b,t:Date.now()});S.msgs=S.msgs.slice(-200);save()}};

/* ================= helpers ================= */
const app=h=>{$('#app').innerHTML=h};let timer=null,authMode='login',authEmail='',tgt=null,curT=null,tool='pen',pcolor='#ffffff',aTab='settings';
function toast(m,ms=2500){const e=$('#toast');e.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.i);toast.i=setTimeout(()=>e.innerHTML='',ms)}
const modal=h=>{$('#modal').innerHTML=`<div class="modal" data-act="close"><div class="card">${h}</div></div>`},closeM=()=>$('#modal').innerHTML='';
const guard=fn=>{try{fn()}catch(e){toast(e.message)}};
function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};i.onerror=()=>no(Error('Invalid image'));i.src=u})}

/* ================= nav + router ================= */
const route=()=>(location.hash.slice(2)||'').split('/')[0];
function nav(){const me=cur(),r=route(),L=[['','nav.home'],['store','nav.store'],['skin','nav.skin'],['chat','nav.chat'],['support','nav.support']];if(isAdm(me))L.push(['admin','nav.admin']);
 $('#nav').innerHTML=`<a class="brand" href="#/">MONRICE<b>SMP1</b></a><nav>${L.map(([h,k])=>`<a href="#/${h}" class="${r===h?'active':''}">${t(k)}</a>`).join('')}</nav><div class="nav-right"><div class="seg">${['en','fa'].map(l=>`<button class="${lang===l?'on':''}" data-act="lang" data-v="${l}">${l==='en'?'EN':'فا'}</button>`).join('')}</div>${me?`<button class="btn sm ghost" data-act="logout">${esc(me.u)} · ${t('nav.logout')}</button>`:`<a class="btn sm" href="#/auth">${t('nav.login')}</a>`}</div>`}
const routes={'':home,store,chat,skin,support,auth,admin};
function go(){clearInterval(timer);document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';(routes[route()]||home)();nav()}
addEventListener('hashchange',go);

 const pv=$('#pvw');pv.onmousemove=e=>{const r=pv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5;pv.querySelectorAll('canvas').forEach(c=>c.style.transform=`rotateY(${x*28}deg)`)};pv.onmouseleave=()=>pv.querySelectorAll('canvas').forEach(c=>c.style.transform='')}
skin.tools=()=>document.querySelectorAll('[data-act=tool]').forEach(b=>b.classList.toggle('on',b.dataset.v===tool));

/* ================= admin ================= */
function admin(){const me=cur();if(!isAdm(me))return app(`<div class="center"><h1>403</h1><a class="btn" href="#/auth">${t('a.login')}</a></div>`);
 const tabs=['settings','products','orders','users','tickets'];let body='';
 if(aTab==='settings'){const s=S.settings;body=`<div class="card"><label>Server status (manual override if the server can't be pinged)</label><div class="switch">${[['auto','AUTO'],['online','FORCE ON'],['offline','FORCE OFF']].map(([v,l])=>`<button class="${s.mode===v?'on':''}" data-act="mode" data-v="${v}">${l}</button>`).join('')}</div><p class="hint" style="margin-bottom:18px">AUTO pings the server. FORCE ON/OFF ignores the ping.</p>
 <form data-form="aset"><label>Server IP</label><input name="ip" value="${esc(s.ip)}"><label>Payment instructions (shown at checkout)</label><textarea name="pay" rows="3">${esc(s.pay)}</textarea><label>Homepage announcement</label><textarea name="ann" rows="2">${esc(s.ann)}</textarea><button class="btn sm">Save</button></form></div>`}
 if(aTab==='products')body=`<div class="card ov"><table><tr><th>Name</th><th>Description</th><th>Category</th><th>Price (IRT)</th><th>On</th><th></th></tr>${[...S.products,{id:0,name:'',desc:'',cat:'Ranks',price:0,on:true}].map(p=>`<tr data-pid="${p.id}"><td><input data-f="name" value="${esc(p.name)}"></td><td><input data-f="desc" value="${esc(p.desc)}"></td><td><input data-f="cat" value="${esc(p.cat)}"></td><td><input data-f="price" type="number" value="${p.price}"></td><td><input data-f="on" type="checkbox" ${p.on?'checked':''}></td><td style="white-space:nowrap"><button class="btn sm" data-act="psave" data-id="${p.id}">${p.id?'Save':'Add'}</button>${p.id?` <button class="btn sm ghost" data-act="pdel" data-id="${p.id}">Del</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(aTab==='orders')body=`<div class="card ov"><table><tr><th>#</th><th>Player</th><th>Item</th><th>IRT</th><th>Proof</th><th>Status</th><th></th></tr>${[...S.orders].reverse().map(o=>`<tr><td>${o.id}</td><td><b>${esc(o.u)}</b></td><td>${esc(o.name)}</td><td>${irt(o.price)}</td><td><button class="btn sm ghost" data-act="proof" data-id="${o.id}">View</button></td><td><span class="pill ${o.st}">${o.st}</span></td><td style="white-space:nowrap"><button class="btn sm" data-act="ost" data-id="${o.id}" data-v="approved">Approve</button> <button class="btn sm ghost" data-act="ost" data-id="${o.id}" data-v="rejected">Reject</button></td></tr>`).join('')}</table></div>`;
 if(aTab==='users')body=`<div class="card ov"><table><tr><th>User</th><th>Email</th><th>Role</th><th>Rank</th><th></th></tr>${S.users.filter(u=>u.ok).map(u=>`<tr><td><b>${esc(u.u)}</b></td><td class="dim">${esc(u.e)}</td><td><span class="pill">${isOwn(u)?'owner':u.role}</span></td><td><input data-ru="${esc(u.u)}" value="${esc(u.rank)}"></td><td style="white-space:nowrap"><button class="btn sm" data-act="urank" data-u="${esc(u.u)}">Set rank</button>${me.role==='owner'&&!isOwn(u)?` <button class="btn sm ghost" data-act="urole" data-u="${esc(u.u)}" data-v="${u.role==='admin'?'player':'admin'}">${u.role==='admin'?'Demote':'Make admin'}</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(aTab==='tickets')body=`<div class="two"><div>${tList([...S.tickets].reverse(),1)||''}</div><div class="card" id="tv"></div></div>`;
 app(`<h1>Admin ${me.role==='owner'?'<span class="tag owner">OWNER</span>':''}</h1><div class="tabs">${tabs.map(x=>`<button class="btn sm ${aTab===x?'':'ghost'}" data-act="atab" data-v="${x}">${x}</button>`).join('')}</div>${body}`);if(aTab==='tickets')renderThread()}

/* ================= events ================= */
const A={
 close(el,e){if(e.target===el)closeM()},close2:()=>closeM(),lang(el){lang=el.dataset.v;localStorage.setItem('lang',lang);go()},
 logout(){S.session=null;save();location.hash='#/';go()},
 copy(){navigator.clipboard?.writeText(S.settings.ip).then(()=>{$('#ch').textContent=t('copied');setTimeout(()=>$('#ch').textContent=t('copy'),1500)}).catch(()=>{})},
 buy:el=>buy(el.dataset.id),order:el=>order(el.dataset.id),
 target(el){if(isAdm(cur())){tgt=el.dataset.u;rankBar()}},untarget(){tgt=null;rankBar()},
 rank(el){guard(()=>{API.setRank(cur(),tgt,el.dataset.r||$('#cr').value);tgt=null;rankBar();renderMsgs()})},
 amode(){authMode=authMode==='login'?'register':'login';auth()},
 tsel(el){curT=+el.dataset.id;document.querySelectorAll('.tk').forEach(x=>x.classList.toggle('on',x===el));renderThread()},
 tclose(){const k=S.tickets.find(x=>x.id===curT);if(k){k.st='closed';save();route()==='admin'?admin():support()}},
 tool(el){tool=el.dataset.v;skin.tools()},sgen(){gen($('#sp').value,$('#sw').checked)},sex(el){$('#sp').value=el.dataset.v;gen(el.dataset.v,$('#sw').checked)},
 sclr(){cx.clearRect(0,0,64,64);persist();preview()},sexp(){sk.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='monricesmp1-skin.png';a.click()})},
 atab(el){aTab=el.dataset.v;admin()},mode(el){S.settings.mode=el.dataset.v;save();admin()},
 psave(el){const r=document.querySelector(`tr[data-pid="${el.dataset.id}"]`),g=f=>r.querySelector(`[data-f=${f}]`),id=+el.dataset.id,o={name:g('name').value.trim(),desc:g('desc').value,cat:g('cat').value||'Items',price:Math.max(0,parseInt(g('price').value)||0),on:g('on').checked};
  if(!o.name)return toast('Name required');if(id)Object.assign(S.products.find(p=>p.id===id),o);else S.products.push({id:++S.seq,...o});save();toast('Saved');admin()},
 pdel(el){if(confirm('Delete?')){S.products=S.products.filter(p=>p.id!=el.dataset.id);save();admin()}},
 proof(el){const o=S.orders.find(x=>x.id==el.dataset.id);modal(`<img src="${o.proof}" style="width:100%;border-radius:12px"><button class="btn ghost" style="margin-top:12px" data-act="close2">OK</button>`)},
 ost(el){S.orders.find(x=>x.id==el.dataset.id).st=el.dataset.v;save();admin()},
 urank(el){guard(()=>{API.setRank(cur(),el.dataset.u,document.querySelector(`[data-ru="${el.dataset.u}"]`).value);toast('Saved');admin()})},
 urole(el){guard(()=>{API.setRole(cur(),el.dataset.u,el.dataset.v);admin()})}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e)});
const FORMS={
 chat(f){guard(()=>{API.chat(cur(),f.b.value);f.b.value='';renderMsgs()})},
 treply(f){const me=cur(),k=S.tickets.find(x=>x.id===curT);if(!k||!f.b.value.trim())return;k.msgs.push({u:me.u,b:f.b.value.trim(),staff:isAdm(me)&&k.uid!==me.id,t:Date.now()});save();renderThread()},
 tnew(f){const me=cur(),k={id:++S.seq,uid:me.id,u:me.u,subj:f.s.value.trim(),st:'open',msgs:[{u:me.u,b:f.m.value.trim(),t:Date.now()}]};S.tickets.push(k);curT=k.id;save();support()},
 aset(f){Object.assign(S.settings,{ip:f.ip.value.trim()||CONFIG.IP,pay:f.pay.value,ann:f.ann.value});save();toast('Saved')},
 async auth(f){const ae=$('#ae');ae.innerHTML='';try{
  if(authMode==='register'){authEmail=await API.register(f.u.value,f.p.value,f.e.value);authMode='verify';auth()}
  else if(authMode==='login'){const r=await API.login(f.u.value,f.p.value);if(r.verify){authEmail=r.verify;authMode='verify';auth()}else{location.hash='#/';go()}}
  else{API.verify(authEmail,f.c.value);authMode='login';location.hash='#/';go()}}catch(e){ae.innerHTML=`<div class="err">${esc(e.message)}</div>`}}};
document.addEventListener('submit',e=>{e.preventDefault();FORMS[e.target.dataset.form]?.(e.target)});
go();
</script>
</body>
</html>
